filter_groupby_dict:
    b3_d1_wX_r96:
        filters: 
            display_name: 
                "$regex": "b3_d1_w.*_r96"
            tags: constant_scheduler
        group_by: model.width_coefficient

    b3_dX_w1_r96:
        filters: 
            display_name: 
                "$regex": "b3_d.*_w1_r96"
            tags: constant_scheduler
        group_by: model.depth_coefficient

    b4_dX_w1_r96:
        filters: 
            display_name: 
                "$regex": "b4_d.*_w1_r96"
            tags: constant_scheduler
        group_by: model.depth_coefficient

    b4_d1_w1_rX:
        filters: 
            display_name: 
                "$regex": "b4_d1_w1_r.*"
            tags: constant_scheduler
        group_by: training.dataset.resolution

    b4_d1_wX_r128:
        filters: 
            display_name: 
                "$regex": "b4_d1_w.*_r128"
            tags: constant_scheduler
        group_by: model.width_coefficient

    b4_d1_wX_r96:
        filters: 
            display_name: 
                "$regex": "b4_d1_w.*_r96"
            tags: constant_scheduler
        group_by: model.width_coefficient



