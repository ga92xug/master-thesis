plots:
    width_scaling:
        paths:
            w_: b3_d1_wX_r96
            #w1: baseline_isic2019_3blocks
            #w_: width_scaling_experiment
        colors: [b]
        linestyles: ['-']
    
    depth_scaling:
        paths:
            b3d_: b3_dX_w1_r96
            b4d_: b4_dX_w1_r96
        colors: [b, r]
        linestyles: ['-', '-']

    resolution_scaling:
        paths:
            r_: b4_d1_w1_rX
        colors: [b]
        linestyles: ['-']

    compound_scaling:
        paths:
            b3_d1_r96: b3_d1_wX_r96
            b4_d1_r96: b4_d1_wX_r96
            b4_d1_w2_r128: b4_d1_wX_r128
        colors: [b, r, g, y]
        linestyles: ['-', '--', '-.', ':']
    


compound:
    b3_d1_wX_r96:
        filters: 
            display_name: 
                "$regex": "b3_d1_w.*_r96"
        group_by: model.width_coefficient

    b3_d1_wX_r128:
        filters: 
            display_name: 
                "$regex": "b3_d1_w.*_r128"
        group_by: model.width_coefficient

    # b4_d1.4_wX_r128


