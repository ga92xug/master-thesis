filter_groupby_dict:
    # width scaling
    b3_d-1-2-2_wX_r96:
        filters: 
            display_name: 
                #b3_d-1-2-2_w1_r96
                "$regex": "b3_d-1-2-2_w.*_r96"
            tags: constant_scheduler
        group_by: model.width_coefficient

    # depth scaling
    b3_dX_w1_r96:
        filters: 
            display_name: 
                "$regex": "b3_d.*_w1_r96"
            tags: constant_scheduler
        group_by: model.num_layer_blocks

    # depth scaling
    b4_dX_w1_r96:
        filters: 
            display_name: 
                "$regex": "b4_d.*_w1_r96"
            tags: constant_scheduler
        group_by: model.num_layer_blocks

    # resolution scaling
    b3_d-1-2-2_w1_rX:
        filters: 
            display_name: 
                "$regex": "b3_d-1-2-2_w1_r.*"
            tags: constant_scheduler
        group_by: training.dataset.resolution

    b4_d-1-2-2-2_w1_rX:
        filters: 
            display_name: 
                "$regex": "b4_d-1-2-2-2_w1_r.*"
            tags: constant_scheduler
        group_by: training.dataset.resolution

    # compound scaling
    b4_d-1-2-2_wX_r96:
        filters: 
            display_name: 
                "$regex": "b4_d1_w.*_r96"
            tags: constant_scheduler
        group_by: model.width_coefficient

    b4_d-1-2-2-2_wX_r128:
        filters: 
            display_name: 
                "$regex": "b4_d-1-2-2-2_w.*_r128"
            tags: constant_scheduler
        group_by: model.width_coefficient

    b4_d-1-2-3-3_wX_r128:
        filters: 
            display_name: 
                "$regex": "b4_d-1-2-3-3_w.*_r128"
            tags: constant_scheduler
        group_by: model.width_coefficient

    b4_d-1-3-3-3_wX_r192:
        filters: 
            display_name: 
                "$regex": "b4_d-1-3-3-3_w.*_r192"

            "config.model.width_coefficient": 
                "$lt": 1.9
            #"$lt": 
            #    "config.model.width_coefficient": 1.5
                    
            tags: constant_scheduler
        group_by: model.width_coefficient


