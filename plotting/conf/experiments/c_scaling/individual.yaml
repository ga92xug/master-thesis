plots:
    width_scaling:
        paths:
            b3_d-1-2-2_wX_r96: b3_d-1-2-2_wX_r96
            #wX: b3_d-1-2-2_wX_r96
            #w1: baseline_isic2019_3blocks
            #w_: width_scaling_experiment
        colors: [b]
        linestyles: ['-']
    
    depth_scaling:
        paths:
            b3_dX_w1_r96: b3_dX_w1_r96
            b4_dX_w1_r96: b4_dX_w1_r96
            #b3dX: b3_dX_w1_r96
            #b4dX: b4_dX_w1_r96
        colors: [b, r]
        linestyles: ['-', '-']

    resolution_scaling:
        paths:
            b3_d-1-2-2_w1_rX: b3_d-1-2-2_w1_rX
            b4_d-1-2-2-2_w1_rX: b4_d-1-2-2-2_w1_rX
            #b3rX: b3_d-1-2-2_w1_rX
            #b4rX: b4_d-1-2-2-2_w1_rX
        colors: [b, r]
        linestyles: ['-', '-']

    compound_scaling:
        paths:
            #wX: b3_d-1-2-2_wX_r96
            #wX: b4_d-1-2-2-2_wX_r128
            #wX: b4_d-1-3-3-3_wX_r192

            b3_d-1-2-2_wX_r96: b3_d-1-2-2_wX_r96
            #b4_d-1-2-2-2_wX_r128: b4_d-1-2-2-2_wX_r128
            b4_d-1-2-3-3_wX_r128: b4_d-1-2-3-3_wX_r128
            b4_d-1-3-3-3_wX_r192: b4_d-1-3-3-3_wX_r192

            #b4_d-1-2-2-2_wX_r96: b4_d1_wX_r96
        colors: [b, r, g, y]
        linestyles: ['-', '-', '-.', ':']
    


compound:
    b3_d1_wX_r96:
        filters: 
            display_name: 
                "$regex": "b3_d1_w.*_r96"
        group_by: model.width_coefficient

    b3_d1_wX_r128:
        filters: 
            display_name: 
                "$regex": "b3_d1_w.*_r128"
        group_by: model.width_coefficient

    # b4_d1.4_wX_r128


