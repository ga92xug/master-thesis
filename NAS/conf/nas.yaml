exp_name: cifar10
seed: 42

training:
  model: eq_nasnet
  training: train_e2_100epochs
  dataset: cifar10
  optimizer: SGD
  nas.max_building_time: 600    # in seconds
  nas.max_gflops: 1000         # in GFLOPS
  #optimizer.lr: 0.015


generation:
  num_total_trials: 50  # total evaluation budget
  num_sobol_trials: 5
  num_fullbayesian_trials: -1
  batch_size: 1
  #num_botorch_trials: 15

runner:
  script_path: "experiment/main.py"
  verbose: 0

other:
  evaluate_every: 1
  save_every: 1
  restart: True
  verbose: 1

objective:
  bounds:
    valid_acc: 0.90
    gflops: 20

search_space:
  num_middle_blocks: 2
  strides: [2, 2, 2]
  choice_2_range_params:
      group: [1, 2, 4, 8, 16]
      kernel_size: [3, 5]
      out_channels: [1.,1.25,1.5,1.75,2]
      se_ratio: [0., 0.25]


wandb:
  entity: "ga92xug"
  project: "scaling-laws-nas_high_level"
  mode: online
  mode_runs: disabled