exp_name: "mnist_rot"

generation:
  num_total_trials: 50  # total evaluation budget
  num_sobol_trials: 10
  num_fullbayesian_trials: -1
  #num_botorch_trials: 15

runner:
  script_path: "experiment/main.py"

other:
  evaluate_every: 1
  save_every: 1
  save_path: "data/"
  restart: True
  verbose: 1

objective:
  bounds:
    val_acc: 0.862
    gflops: 77

search_space:
  choice_2_range_params:
      group: [1, 2, 4, 8, 16],
      kernel_size: [3, 5],
      out_channels: [1.,1.25,1.5,1.75]
      se_ratio: [0., 0.25]

  strides: [2, 2, 2]
  num_blocks: 2
  verbose: 1


wandb:
  entity: "ga92xug"
  high_level:
    project: "scaling-laws-nas_high_level"
    mode: online
  runs:
    project: "scaling-laws-nas_runs"
    mode: online