name: vit_DeepDRiD_r224_pretrained_F

program: training/main.py
project: SL-sweeps
method: bayes
run_cap: 20

metric:
  goal: maximize
  name: valid.acc

early_terminate:
  type: hyperband
  min_iter: 50

# wandb sweep nested dict workaround https://community.wandb.ai/t/nested-sweep-configuration/3369/3
parameters:
  training:
    parameters:
      scheduler:
        parameters:
          patience:
            distribution: int_uniform
            min: 5 
            max: 100
          factor:
            distribution: log_uniform_values
            min: 0.01
            max: 0.5
      optimizer:
        parameters:
          lr:
            distribution: log_uniform_values
            min: 5e-05 # 0.00005
            max: 0.01
          weight_decay:
            distribution: log_uniform_values
            min: 1e-07 # 0.0000001
            max: 1e-03 # 0.001

command:
  - python
  - ${program}
  - training=DeepDRiD-training
  - model=vit
  - training.dataset.resolution=224
  - model.pretrained=False
  - other.should_test=True

# create sweep
# wandb sweep --project SL-sweeps experiments/d_application_experiment/0_HPO_sweeps/vit_DeepDRiD.yaml