HPOs: 
  eq_nasnet_ISIC2019_r128:
    done: True
    dropout_rate: True          # if not defined False
    additional_params:
      model: eq_nasnet
      "model/blocks_args_dict": 4blocks

  efficientnet_pretrained_ISIC2019_r128:
    done: False
    restore: False
    additional_params:
      model: efficientnet
      model.pretrained: True

  efficientnet_not_pretrained_ISIC2019_r128:
    done: False
    additional_params:
      model: efficientnet
      model.pretrained: False

  vit_not_pretrained_ISIC2019_r128:
    done: False
    restore: False
    additional_params:
      model: vit
      model.pretrained: False

  vit_pretrained_ISIC2019_r128:
    restore: False
    done: False
    additional_params:
      model: vit
      model.pretrained: True

metric:
  goal: max
  name: valid.acc_weighted

optimizer:
  num_trials: 40
  grace_period: 50

additional_params:
  wandb.project: SL-ray
  training: isic2019-training
  other.should_test: True
  other.verbose: 0
  training.dataset.resolution: 128

  training.earlystop.stop: True          
  training.earlystop.monitor: valid.acc_weighted
  training.earlystop.mode: max
  training.earlystop.patience: 20
  training.earlystop.min_delta: 0.001
  training.earlystop.store_in_memory: True