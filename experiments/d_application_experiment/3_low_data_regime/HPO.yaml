defaults:
  - _self_
  - dataset: DeepDRiD

HPOs: 
  eq_nasnet:
    done: False
    restore: True
    eval_only: False
    dropout_rate: True          # if not defined False
    model_overrides:
      model: eq_nasnet
      "model/blocks_args_dict": 4blocks

  efficientnet:
    done: False
    eval_only: False
    restore: False
    model_overrides:
      model: efficientnet
      model.pretrained: False

  efficientnet_pre:
    done: False
    restore: False
    model_overrides:
      model: efficientnet
      model.pretrained: True

  vit:
    done: False
    model_overrides:
      model: vit
      model.pretrained: False

  vit_pre:
    done: False
    model_overrides:
      model: vit
      model.pretrained: True

dataset:
  global_overrides:
    wandb.project: SL-ray
    training: ${dataset.name}-training 
    training.dataset.resolution: 128
    other.should_test: True
    other.verbose: 1

    training.dataset.reduction_factor: 0.3
    training.earlystop.baseline: null

    debug: False
    wandb.mode: online
    #training.earlystop.patience: 0
    #training.epochs: 1

    
    