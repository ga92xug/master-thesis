name: blood

epochs: 500 # 150

metric:
  name: valid.acc

parameters:
  training.optimizer.lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
  # ADAM with 1e-5 = 0.00001 original weight decay
  training.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 0.000001 
    max: 0.1
