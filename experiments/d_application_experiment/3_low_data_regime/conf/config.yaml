defaults:
- _self_
- sweep_config: blood

# model
model: densenet

# percentage
percentage: 10 # 1, 10, , 50, 100

sweep_config:
  program: training/main.py
  method: bayes
  run_cap: 25

  metric:
    goal: maximize
    # name specified in the sweep-config

  early_terminate:
    type: hyperband
    # min_iter 10% of epochs -> done in script

  # parameters specified in the sweep-config

  project: SL-sweeps


  command:
    - python
    - ${sweep_config.program}
    - model=${model}
    - training=${sweep_config.name}-training
    - training.epochs=${sweep_config.epochs}
    # there is no better way to change the scheduler since the training specifies some of the scheduler params
    # https://github.com/facebookresearch/hydra/issues/2227 easier replacement issue
    #- ~training.scheduler  
    #- +training.scheduler._target_=torch.optim.lr_scheduler.CosineAnnealingLR
    #- other.debug=True
    # same as for sweep where we searched HP for the normal data regime
    #- model.restrict=[halved,halved]
