#name: myenv

channels:
  - pytorch
  - conda-forge
  - defaults
  - nvidia

dependencies:
  - python=3.11
  - pytorch=2.1.0
  - pytorch-cuda=11.8
  - torchvision # =0.16
  - torchaudio # =2.1.0
  - lightning # =2.1
  - torchmetrics # =0.11
  - hydra-core=1.3
  #- rich=13.7
  #- pre-commit=3.*
  - einops
  - iopath
  - pytest=7.4
  - wandb
  - ax-platform
  - foolbox
  - fvcore
  - h5py
  - opt_einsum
  - pillow
  - scikit-image
  - scikit-learn

  - pip>=23
  - pip:
      - hydra-optuna-sweeper
      - hydra-colorlog
      - rootutils

# pip install everything

