defaults:
- _self_
- callbacks: default
- dataset/custom@dataset:  isic2019 #imagenette
- network: efficientnet
- optimizer: Adam
- scheduler: none 

_target_: src.training_loop.lightning_module.LitModule
compile: false

optimizer:
  lr: 0.005
  weight_decay: 1e-5

# scheduler: null
#  metric: valid/acc
#  mode: max
#  factor: 0.1
#  patience: 10

callbacks:
  model_checkpoint:
    monitor: "valid/acc"
    mode: "max"
    save_last: True
    auto_insert_metric_name: False

  early_stopping:
    monitor: "valid/acc"
    patience: 100
    mode: "max"




