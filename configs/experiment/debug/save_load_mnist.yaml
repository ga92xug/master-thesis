# @package _global_

# to execute this experiment run:
# python train.py experiment=pre-training/example

defaults:
  - override /train/dataset: mnist # imagenet
  - override /train/network: eq_nasnet #efficientnet eq_nasnet
  - override /train/network/blocks_args_dict: 3blocks
  - override /train/optimizer: Adam
  - override /train/scheduler: null
  - override /logger: wandb
  - override /train/callbacks: default 

tags: ["pre-train_imagenette", "no_swa_and_ema"]

seed: 0

ckpt_path: "logs/train/runs/2024-02-01_18-29-47/checkpoints/last.ckpt" # train/runs/2024-01-24_19-58-34/checkpoints/epoch_003.ckpt
train_mode: train_continue # train_with_pretrain
test_mode: test

