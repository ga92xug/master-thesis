# @package _global_
defaults:
  - override /training: isic2019
  
train:
  network:
    kernel_size: 3
    blocks_args_dict:
      _1:
        kernel_size: ${model.kernel_size}
      _2:
        kernel_size: ${model.kernel_size}
      _3:
        kernel_size: ${model.kernel_size}
    width_coefficient: 1.1
  
tags: [ablation_nas_architecture, change_kernel_size]

logger:
  wandb:
    notes: change_kernel_size_$(model.conv_op)
