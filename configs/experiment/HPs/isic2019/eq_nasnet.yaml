# @package _global_
defaults:
  - HPs/isic2019/all
  - override /train/network: eq_nasnet
  - override /train/scheduler: reduce_lr_on_plateau

train:
  optimizer:
    lr: 0.0025107148951358034
    weight_decay: 0.000004175423970766061
  scheduler:
    factor: 0.9
    patience: 17
    metric: valid/acc_weighted
