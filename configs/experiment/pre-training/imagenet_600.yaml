# @package _global_
defaults:
  - override /train: imagenet
  - override /train/network: eq_nasnet #eq_nasnet
  - override /train/network/blocks_args_dict: 4blocks
  - override /logger: wandb

tags: ["pre-train_imagenet_100"]

seed: 0
logger:
  wandb:
    project: "pre-train"

train:
  trainer:
    max_epochs: 600
  dataset:
    mixup_alpha: 0.2
    cutmix_alpha: 1.0

hardware:
  strategy: auto
  devices: 1
  num_nodes: 1
  #sync_batchnorm: True


