# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /training_setup/dataset: imagenet
  - override /training_setup/network: eq_nasnet #eq_nasnet
  - override /training_setup/optimizer: SGD
  - override /training_setup/scheduler: cosine_annealing_lr
  - override /logger: wandb
  - override /training_setup/callbacks: default 

tags: ["pre-train_imagenet"]

seed: 0
logger:
  wandb:
    project: "pre-train"
    mode: offline

train_mode: train
test_mode: no_test

training_setup:
  label_smoothing: 0.1

  trainer:
    min_epochs: 10
    max_epochs: 600

  optimizer:
    nesterov: False
    momentum: 0.9
    lr: 0.5
    weight_decay: 2e-05

  scheduler:
    warmup_epochs: 5
    # warmup_method: only linear currently not supported
    warmup_decay: 0.01

  callbacks:
    swa:
      _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
      swa_lrs: 0.05
    batch_size_finder:
      _target_: lightning.pytorch.callbacks.BatchSizeFinder
      batch_arg_name: batch_size_per_device
      steps_per_trial: 10
      mode: binsearch

  dataset:
    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    # we autotune the batch size to fit into memory
    batch_size: 128 # 128 * 8

    ra_sampler: True
    ra_reps: 4

    augment:
      interpolation: BILINEAR
      train:
        RandomResizedCrop:
          size: 176
        RandomHorizontalFlip:
          p: 0.5
        TrivialAugmentWide:
          interpolation: BILINEAR
        RandomErasing:
          p: 0.1

      eval:
        short_side_center_crop:
          resize_size: 232
          crop_size: 224


hardware:
  strategy: auto
  devices: 1
  num_nodes: 1
  sync_batchnorm: True


