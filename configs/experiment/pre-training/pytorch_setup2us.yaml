# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  #- override training_setup/dataset: cifar10 # imagenet
  - override /training_setup/network: efficientnet #eq_nasnet
  - override /training_setup/optimizer: SGD
  - override /training_setup/scheduler: cosine_annealing_lr
  - override /logger: null
  #- override training_setup/callbacks: default 

tags: ["pre-train_imagenet"]

seed: 0

training_setup:
  trainer:
    min_epochs: 10
    max_epochs: 600

  optimizer:
    nesterov: False
    momentum: 0.9
    lr: 0.5
    weight_decay: 2e-05

  scheduler:
    warmup_epochs: 5
    # warmup_method: linear currently not supported
    warmup_decay: 0.01

  dataset:
    # we autotune the batch size to fit into memory
    batch_size: 1024 # 128 * 8


hardware:
  strategy: ddp_spawn
  devices: 1
  num_nodes: 1
  sync_batchnorm: True


