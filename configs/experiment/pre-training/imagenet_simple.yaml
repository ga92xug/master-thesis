# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /train/dataset: imagenet
  - override /train/network: eq_nasnet #eq_nasnet
  - override /train/network/blocks_args_dict: 4blocks # 1_debug # 4blocks
  - override /train/optimizer: SGD
  - override /train/scheduler: cosine_annealing_lr
  - override /logger: wandb
  - override /train/callbacks: default 

tags: ["pre-train_imagenet"]

seed: 0
ckpt_path: "" 
train_mode: train
#train_mode: train
test_mode: test

logger:
  wandb:
    project: "pre-train"

train:
  #label_smoothing: 0.1

  trainer:
    min_epochs: 1
    max_epochs: 1
    #limit_train_batches: 0.04

  optimizer:
    nesterov: False
    momentum: 0.9
    lr: 0.5
    weight_decay: 2e-05

  scheduler:
    warmup_epochs: 5
    # warmup_method: only linear currently not supported
    warmup_decay: 0.01

  callbacks:
    metric_print:
      _target_: src._callbacks.metric_print.Metric_Print
      mode: "memory"
    # swa:
    #   _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
    #   swa_lrs: 0.05
    #   swa_epoch_start: 0.001
    # batch_size_finder:
    #   _target_: lightning.pytorch.callbacks.BatchSizeFinder
    #   batch_arg_name: batch_size_per_device
    #   steps_per_trial: 10
    #   mode: binsearch

  dataset:
    resolution: 224
    #mixup_alpha: 0.2
    #cutmix_alpha: 1.0
    # we autotune the batch size to fit into memory
    batch_size: 100 # 128 * 8
    
    augment:
      interpolation: BILINEAR
      train:
        RandomResizedCrop:
          size: 176
        RandomHorizontalFlip:
          p: 0.5
        TrivialAugmentWide:
          interpolation: BILINEAR
        RandomErasing:
          p: 0.1

      eval:
        short_side_center_crop:
          resize_size: 232
          crop_size: 224


hardware:
  strategy: auto
  accelerator: gpu
  devices: 1
  num_nodes: 1
  #sync_batchnorm: True


