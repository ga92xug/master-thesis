# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /train/dataset: imagenette
  - override /train/network: eq_nasnet #eq_nasnet
  #- override /train/network/blocks_args_dict: 4blocks # 1_debug # 4blocks
  - override /train/optimizer: SGD
  - override /train/scheduler: cosine_annealing_lr
  - override /logger: wandb
  - override /train/callbacks: default 

tags: ["res128"]

seed: 0
ckpt_path: ""
train_mode: train
#train_mode: train
test_mode: test

logger:
  wandb:
    project: "pre-train_imagnette"
#    mode: offline

train:
  #label_smoothing: 0.1

  trainer:
    min_epochs: 1
    max_epochs: 20
    #limit_train_batches: 0.04

  optimizer:
    nesterov: False
    momentum: 0.9
    lr: 0.1
    weight_decay: 1e-05

  scheduler:
    warmup_epochs: 5
    # warmup_method: only linear currently not supported
    warmup_decay: 0.01

  # callbacks:

  dataset:
    resolution: 224
    #mixup_alpha: 0.2
    #cutmix_alpha: 1.0
    # we autotune the batch size to fit into memory
    batch_size: 128 # 224 # 128 * 8
    
    augment:
      interpolation: BILINEAR
      train:
        RandomResizedCrop:
          size: 176 # 176
        RandomHorizontalFlip:
          p: 0.5
        TrivialAugmentWide:
          interpolation: BILINEAR
        RandomErasing:
          p: 0.1

      eval:
        short_side_center_crop:
          resize_size: 232 # 232
          crop_size: 224 # 224


hardware:
  strategy: auto
  accelerator: gpu
  devices: 1
  num_nodes: 1
  #sync_batchnorm: True


