# @package _global_

# to execute this experiment run:
# python train.py experiment=pre-training/example

defaults:
  - override /training_setup/dataset: imagenette # imagenet
  - override /training_setup/network: eq_nasnet #efficientnet eq_nasnet
  - override /training_setup/optimizer: SGD
  - override /training_setup/scheduler: null
  - override /logger: null
  - override /training_setup/callbacks: default 

tags: ["pre-train_imagenette", "no_swa_and_ema"]

seed: 0

ckpt_path: logs/train/runs/2024-01-29_03-30-51/checkpoints/epoch_006.ckpt # train/runs/2024-01-24_19-58-34/checkpoints/epoch_003.ckpt
train_mode: evaluate_only # train_with_ckpt
test_mode: test

training_setup:
  # label_smoothing: 0.1

  trainer:
    min_epochs: 1
    max_epochs: 7
    #limit_train_batches: 0.1

  optimizer:
    nesterov: False
    momentum: 0.9
    lr: 0.5
    weight_decay: 2e-05

  #scheduler:
  #  warmup_epochs: 5
  #  # warmup_method: only linear currently not supported
  #  warmup_decay: 0.01

  callbacks:
    model_checkpoint:
      save_top_k: -1
    #compare_model:
    #  _target_: src._callbacks.save_and_load.CompareModelCallback
    #swa:
    #  _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
    #  swa_lrs: 0.05
    #prediction_writer:
    #  _target_: src._callbacks.write_predictions.Prediction_txt_Writer
    #  output_dir: ${paths.output_dir}
    # stop_training:
    #   _target_: src._callbacks.stop_training.Stop_After_Epoch
    #   stop_after_epoch: 50

  dataset:
    #mixup_alpha: 0.2
    #cutmix_alpha: 1.0
    # we autotune the batch size to fit into memory
    batch_size: 100 # 128 * 8

    ra_sampler: True
    ra_reps: 4

    augment:
      interpolation: BILINEAR
      train:
        RandomResizedCrop:
          size: 176
        RandomHorizontalFlip:
          p: 0.5
        TrivialAugmentWide:
          interpolation: BILINEAR
        RandomErasing:
          p: 0.1

      eval:
        short_side_center_crop:
          resize_size: 232
          crop_size: 224


hardware:
  strategy: auto
  accelerator: gpu
  devices: 1
  num_nodes: 1
  #sync_batchnorm: True


