# @package _global_
defaults:
  - override /train: isic2019
  - override /train/network: efficientnet 
  - override /train/scheduler: reduce_lr_on_plateau
  - override /logger: wandb
  - _self_

train:
  network:
    pretrained: False
  optimizer:
    lr: 0.01
    weight_decay: 0.0000001

  scheduler:
    factor: 0.02493979877210027
    patience: 7
    metric: valid/acc_weighted
    mode: max

task_name: isic2019
tags: ["isic2019"]

logger:
  wandb:
    project: ${task_name}

