# @package _global_
defaults:
  - override /train: isic2019
  - override /train/network: vit 
  - override /train/scheduler: reduce_lr_on_plateau
  - override /logger: wandb
  - override /train/callbacks: default 
  - _self_

tags: ["redo_vit_isic2019_res128"]

train:
  network:
    pretrained: True
  optimizer:
    lr: 0.00005
    weight_decay: 0.00001016592074437349

  scheduler:
    factor: 0.03079828066268554
    patience: 7
    verbose: True

logger:
  wandb:
    project: low_data