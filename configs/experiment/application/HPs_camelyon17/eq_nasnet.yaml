# @package _global_
defaults:
  - override /train/network: eq_nasnet
  - override /train: camelyon17
  - override /logger: wandb

task_name: camelyon17_domain_shift
test_mode: test
tags: [camelyon17_domain_shift]

logger:
  wandb:
    project: domain_shift

train:
  trainer:
    max_epochs: 3
  dataset:
    batch_size: 512  
  optimizer:
    lr: 0.005
    weight_decay: 1e-5