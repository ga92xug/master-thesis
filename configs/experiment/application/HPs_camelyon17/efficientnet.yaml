# @package _global_
defaults:
  - override /train/network: efficientnet
  - override /train: camelyon17
  - override /logger: wandb

test_mode: test

logger:
  wandb:
    project: domain_shift

train:
  trainer:
    max_epochs: 5
  dataset:
    batch_size: 512  
  optimizer:
    lr: 0.004430375245218269
    weight_decay: 0.0007257005721594283