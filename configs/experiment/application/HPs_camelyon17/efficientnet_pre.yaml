# @package _global_
defaults:
  - override /train/network: efficientnet
  - override /train: camelyon17
  - override /logger: wandb

task_name: camelyon17_domain_shift
test_mode: test

logger:
  wandb:
    project: domain_shift

train:
  network:
    pretrained: True
  trainer:
    max_epochs: 5
  dataset:
    batch_size: 512  
  optimizer:
    lr: 0.08051581638637594 # 0.0006289803933672041
    weight_decay: 4.418308267895584e-06 # 3.3861506599629644e-05

