# @package _global_
defaults:
  - override /train/network: efficientnet
  - override /train: camelyon17
  - override /logger: wandb

test_mode: test

logger:
  wandb:
    project: domain_shift

train:
  network:
    pretrained: True
  trainer:
    max_epochs: 5
  dataset:
    batch_size: 512  
  optimizer:
    lr: 0.0006289803933672041
    weight_decay: 3.3861506599629644e-05
