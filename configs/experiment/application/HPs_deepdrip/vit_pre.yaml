# @package _global_
defaults:
  - override /train: deepdrip
  - override /train/network: vit
  - override /train/scheduler: reduce_lr_on_plateau
  - override /logger: wandb

train:
  network:
    pre_trained: True
  optimizer:
    lr: 0.00005
    weight_decay: 0.0000197902789003467
  scheduler: 
    patience: 5
    factor: 0.06938868866678677
  trainer:
    log_every_n_steps: 1

task_name: deepdrip_low_data
tags: ["tuned_HPs"]

logger:
  wandb:
    project: low_data

