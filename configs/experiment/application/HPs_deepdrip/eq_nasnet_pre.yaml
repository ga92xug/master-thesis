# @package _global_
defaults:
  - override /train: deepdrip
  - override /train/network: eq_nasnet_pre
  - override /train/scheduler: reduce_lr_on_plateau
  - override /logger: wandb

train:
  optimizer:
    lr: 0.08487 # 0.1
    weight_decay: 0.000005183 # 1.23e-5
  scheduler:
    patience: 14
    factor: 0.9
  trainer:
    log_every_n_steps: 1



task_name: deepdrip_low_data
tags: ["tuned_HPs"]

logger:
  wandb:
    project: low_data
