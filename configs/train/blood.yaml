defaults:
  - _self_
  - dataset: blood
  - callbacks: default
  - network: eq_nasnet
  - optimizer: Adam
  - scheduler: none

callbacks:
  model_checkpoint:
    monitor: "valid/loss"
    mode: "min"
    save_last: True
    auto_insert_metric_name: False

  early_stopping:
    monitor: "valid/loss"
    patience: 15
    mode: "min"

optimizer:
  lr: 0.005
  weight_decay: 1e-5

trainer:
  accumulate_grad_batches: 1
  max_epochs: 100

dataset:
  batch_size: 128                





