defaults:
  - dataset: DeepDRiD
  - callbacks: default
  - network: eq_nasnet
  - optimizer: Adam
  - scheduler: cosine_annealing_lr
  - _self_

callbacks:
  model_checkpoint:
    monitor: "valid/acc_weighted"
    mode: "max"
    save_last: True
    auto_insert_metric_name: False

  early_stopping:
    monitor: "valid/acc_weighted"
    patience: 30
    mode: "max"

optimizer:
  lr: 0.005
  weight_decay: 1e-5

trainer:
  accumulate_grad_batches: 1
  max_epochs: 120

dataset:
  batch_size: 128                


