defaults:
  - dataset: medmnist_tissue
  - callbacks: default
  - network: eq_nasnet
  - optimizer: Adam
  - scheduler: none
  - _self_

metrics_config:
  acc_weighted: 
    _target_: torchmetrics.classification.MulticlassAccuracy
    num_classes: ${train.dataset.num_classes}
    average: macro
    maximize: True

callbacks:
  model_checkpoint:
    monitor: "valid/acc_weighted"
    mode: "max"
    save_last: True
    auto_insert_metric_name: False

  early_stopping:
    monitor: "valid/acc_weighted"
    patience: 5
    mode: "max"

optimizer:
  lr: 0.005
  weight_decay: 1e-5

trainer:
  accumulate_grad_batches: 1
  max_epochs: 10

dataset:
  batch_size: 128                


