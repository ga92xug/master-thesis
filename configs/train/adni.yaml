defaults:
  - dataset: adni
  - callbacks: default
  - network: eq_nasnet
  - optimizer: Adam
  - scheduler: none
  - _self_


callbacks:
  model_checkpoint:
    monitor: "valid/acc"
    mode: "max"
    save_last: True
    auto_insert_metric_name: False

  early_stopping:
    monitor: "valid/acc"
    patience: 30
    mode: "max"

optimizer:
  lr: 0.001
  weight_decay: 1e-5

trainer:
  accumulate_grad_batches: 1
  max_epochs: 100

dataset:
  batch_size: 128                

