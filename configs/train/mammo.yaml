defaults:
  - dataset: mammo
  - callbacks: default
  - network: efficientnet
  - optimizer: Adam
  - scheduler: cosine_annealing_lr


#metrics_config:
#  top_5_accuracy: 
#    _target_: torchmetrics.classification.MulticlassAccuracy
#    num_classes: ${train.dataset.num_classes}
#    top_k: 5
#    average: micro
#    maximize: True

trainer:
  min_epochs: 10
  max_epochs: 10

optimizer:
  lr: 0.1
  weight_decay: 1e-05

dataset:
  batch_size: 128 # 128 * 8

callbacks:
  model_checkpoint:
    monitor: "valid/acc"
    mode: "max"

  early_stopping:
    monitor: "valid/acc"
    patience: 20
    mode: "max"




