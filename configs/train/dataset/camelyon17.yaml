_target_: src.data.datasets.wilds.create_datasets.create_datasets
name: camelyon17

augment:
  train:
    RandomResizedCrop:
      size: 96
      scale: [0.7, 1.0]
    RandomHorizontalFlip: 
      p: 0.5
    # values from https://github.com/i-gao/targeted-augs/tree/main
    StainColorJitterWrapper:
      p: 0.5682688104816859
      sigma: 0.1


resolution: 96

# imagenet values -> change
channel_wise_mean_images: [0.485, 0.456, 0.406]
channel_wise_std_images: [0.229, 0.224, 0.225]

num_channels: 3
num_classes: 2

valid_size: 0.0
test_size: 0.0

should_normalize_weights: False