defaults:
- _custom_defaults
- _self_


name: imagenette
resolution: 224

augment: 
  interpolation: BILINEAR
  train:
    RandomResizedCrop:
      size: 176
    RandomHorizontalFlip:
      p: 0.5
    TrivialAugmentWide:
      interpolation: BILINEAR
    RandomErasing:
      p: 0.1

  eval:
    short_side_center_crop:
      resize_size: 232
      crop_size: 224

channel_wise_mean_images: [0.46947703, 0.4485053, 0.41963148]
channel_wise_std_images: [0.26470295, 0.25778037, 0.27517328]

num_channels: 3
num_classes: 10

val_size: 0.1
test_size: 0.0

should_normalize_weights: False