# @package _global_

# example hyperparameter optimization of some experiment with Optuna:
# python train.py -m hparams_search=mnist_optuna experiment=example

defaults:
  - override /hydra/sweeper: ax
  - override /train/network: eq_nasnet
  - override /train: blood
  - override /train/scheduler: cosine_annealing_lr
  - override /logger: wandb

task_name: ${logger.wandb.project}
test_mode: test
tags: "[blood_eq_nasnet_pretrained_full_data]"

seed: null

train:
  #callbacks:
  #  early_stopping:
  #    _target_: null
  trainer:
    max_epochs: 50

  network:
    dropout_rate: 0.5
    pre_trained: logs/pretrain/2024-02-25_19-32-25/checkpoints/epoch_039.ckpt

logger:
  wandb:
    project: "HparamsSearch"

# choose metric which will be optimized by Optuna
optimized_metric: "valid/loss"

# here we define Optuna hyperparameter search
hydra:
  mode: "MULTIRUN" 

  sweeper:
    _target_: hydra_plugins.hydra_ax_sweeper.ax_sweeper.AxSweeper

    max_batch_size: 2
    ax_config:
      max_trials: 40
      early_stop:
        minimize: true
        max_epochs_without_improvement: 10
        epsilon: 1.0e-05
      experiment:
        name: blood_eq_nasnet_pretrained
        objective_name: ${optimized_metric}
        minimize: true
        parameter_constraints: null
        outcome_constraints: null
        status_quo: null
      client:
        verbose_logging: false
        random_seed: null
      is_noisy: true

      # define hyperparameter search space
      params:
        train.optimizer.lr: 
          type: range
          bounds: [1e-4, 0.1]
          log_scale: true
        train.optimizer.weight_decay: 
          type: range
          bounds: [1e-6, 1e-2]
          log_scale: true


