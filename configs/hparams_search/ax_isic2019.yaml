# @package _global_

# example hyperparameter optimization of some experiment with Optuna:
# python train.py -m hparams_search=mnist_optuna experiment=example

defaults:
  - override /hydra/sweeper: ax
  - override /train: isic2019
  - override /train/network: eq_nasnet_pre
  - override /train/scheduler: cosine_annealing_lr
  - override /logger: wandb

task_name: ${logger.wandb.project}
test_mode: test
tags: ["valid_acc_weighted"]

seed: null

train:
  trainer:
    max_epochs: 120
    val_check_interval: 1.0

    # /home/atuin/b180dc/b180dc27/pre_trained_models/epoch_039.ckpt

logger:
  wandb:
    project: "HparamsSearch"

optimized_metric: "valid/acc_weighted"

# here we define Optuna hyperparameter search
hydra:
  mode: "MULTIRUN" 

  sweeper:
    _target_: hydra_plugins.hydra_ax_sweeper.ax_sweeper.AxSweeper
    max_batch_size: 2
    ax_config:
      max_trials: 40
      early_stop:
        minimize: true
        max_epochs_without_improvement: 10
        epsilon: 1.0e-05
      experiment:
        name: deepdrip_eq_nasnet_pretrained
        objective_name: ${optimized_metric}
        minimize: true
        parameter_constraints: null
        outcome_constraints: null
        status_quo: null
      client:
        verbose_logging: false
        random_seed: null
      is_noisy: true

      # define hyperparameter search space
      params:
        train.optimizer.lr: 
          type: range
          bounds: [1e-4, 0.1]
          log_scale: true
        train.optimizer.weight_decay: 
          type: range
          bounds: [1e-6, 1e-2]
          log_scale: true


