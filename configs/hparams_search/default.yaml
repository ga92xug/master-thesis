# @package _global_
defaults:
  #- override /hydra/launcher: slurm
  - override /hydra/sweeper: ax
  - override /logger: wandb

task_name: ${logger.wandb.project}
test_mode: test
tags: ["HPO"]


seed: null

logger:
  wandb:
    project: HparamsSearch

optimized_metric: "valid/loss"

hydra:
  mode: "MULTIRUN" 
  #launcher:
    #  max_num_timeout: 4
    #  timeout_min: 360
  sweeper:
    _target_: hydra_plugins.hydra_ax_sweeper.ax_sweeper.AxSweeper
    #max_batch_size: 5
    ax_config:
      max_trials: 20
      early_stop:
        minimize: true
        max_epochs_without_improvement: 10
        epsilon: 1.0e-05
      experiment:
        name: blood_eq_nasnet_pretrained
        objective_name: ${optimized_metric}
        minimize: true
        parameter_constraints: null
        outcome_constraints: null
        status_quo: null
      client:
        verbose_logging: false
        random_seed: null
      is_noisy: true

      # define hyperparameter search space
      params:
        train.optimizer.lr: 
          type: range
          bounds: [1e-4, 0.1]
          log_scale: true
        train.optimizer.weight_decay: 
          type: range
          bounds: [1e-6, 1e-2]
          log_scale: true


