program: training/main.py
method: bayes
run_cap: 100
metric:
  goal: maximize
  name: valid.acc

early_terminate:
  type: hyperband
  min_iter: 50

parameters:
  training.optimizer.lr:
    distribution: log_uniform_values
    min: 0.005
    max: 0.1
  training.epochs:
    distribution: int_uniform
    min: 50
    max: 200
  training.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  training.scheduler.patience:
    distribution: int_uniform
    min: 5 
    max: 200
  training.scheduler.factor:
    distribution: log_uniform_values
    min: 0.01
    max: 0.5
  model.dropout_rate:
    distribution: uniform
    min: 0.5
    max: 0.7

command:
  - python
  - ${program}
  - training=DeepDRiD-training
  - model=eq_nasnet
  - model/blocks_args_dict=4blocks
  - other.should_test=True

