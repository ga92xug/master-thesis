program: experiment/main.py
method: bayes
metric:
  goal: maximize
  name: valid.acc

early_terminate:
  type: hyperband
  min_iter: 10

parameters:
  training.optimizer.lr:
    min: 0.0001
    max: 0.1
  training.optimizer.weight_decay:
    min: 0.000001
    max: 0.001
  model.drop_out:
    min: 0.0
    max: 0.5
  training.scheduler.gamma:
    min: 0.001 
    max: 0.1



command:
  - python
  - ${program}
  #- ${args_no_hyphens}
