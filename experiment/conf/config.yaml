defaults:
- _self_
- dataset: cifar10
- model: eq_wrn
- other: default
- optimizer: SGD
- training: train_e2_100epochs

# Dataset parameters        
dataset:
  data_dir: '../Data/frischs/datasets/'  # Path to the datasets        
  augment: True                 # Augment the training set with rotated images
  interpolation: 2              # Type of interpolation to use for data augmentation
  reshuffle: True               # Reshuffle train and valid splits instead of using the default split
  workers: 8                    # Number of jobs to load the dataset
  drop_last_train: False        # Drop the last batch if it is smaller than the batch size

# Model parameters        
# defined in model/*

# Training parameters
training:
  batch_size: 128                # Number of examples to process in a batch during training
  eval_batch_size: 64           # Number of examples to process in a batch during evaluation (default: batch_size)
  epochs: 100                    # Number of training epochs
  steps_per_epoch: -1           # Number of batches to process during each epoch (-1 for all batches)
  earlystop: False               # Whether to use early stopping based on a validation set
  valid_metric: accuracy        # Metric to use for early stopping
  eval_test: False              # Whether to evaluate on the test set during validation
  accumulate: 1                 # Number of batches to accumulate gradients over before updating model
  adapt_lr: null                # Adaptive learning rate scheduler to use (exponential, validation, or Null)
  lr_decay_start: 15            # Epoch to start adaptive learning rate decay
  lr_decay_factor: 0.8          # Factor to multiply learning rate by during adaptive decay
  lr_decay_epoch: 1             # Period (in epochs) between adaptive learning rate decay
  lr_decay_schedule: null       # List of specific epochs for adaptive learning rate decay (alternative to lr_decay_epoch)
  augment_train: False
  compile: False          

# Regularization params
optimizer:
  lr: 0.001                     # Learning rate
  #weight_decay: 0.0005          # Weight decay for SGD or Adam optimizer (if used)

# Other experiment's parameters
other:
  eval_frequency: -1           # Evaluation frequency (counts iterations if positive, epochs if negative. Use -1 to evaluate at the end of each epoch)
  backup_model: False           # Backup the model in a file
  plot_frequency: 100           # Plot frequency (counts iterations if positive, epochs if negative. Use -1 to plot at the end of each epoch)
  store_plot: False              # Store the plot
  show: False                   # Show the plot during training
  backup_frequency: -1          # Backup frequency (counts iterations if positive, epochs if negative. Use -1 to backup at the end of each epoch)
  seed: 42                      # Seed for random number generators
  output_path: 'experiment/outputs/'  # Path to the output directory
  verbose: 2                    # Verbose Level
  time_limit: null              # Maximum time limit for training (in Minutes)
  should_test: True
  gpu_time_limit: False


# WandB
wandb:
  entity: "ga92xug"
  project: scaling-laws-eq         # Name of the wandb project
  mode: online                  # For debugging disabled, online, offline
  watch: False                  # For detailed weight analysis
  # wandb_entity: Null          # Name of the wandb entity default is your username
  notes: null
  give_name: True
  tags: null
  group: null
  run_id: null
