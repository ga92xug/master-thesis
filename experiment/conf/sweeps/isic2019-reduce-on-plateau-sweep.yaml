program: experiment/main.py
method: bayes
metric:
  goal: maximize
  name: valid.acc

early_terminate:
  type: hyperband
  min_iter: 10

parameters:
  training.optimizer.lr:
    min: 0.005
    max: 0.1
  training.scheduler.patience:
    min: 2 
    max: 10
  training.scheduler.factor:
    min: 0.01
    max: 0.9


command:
  - python
  - ${program}
  - training=isic2019-training-reduce
  - wandb.tags=[sweep-isic-reduce]
