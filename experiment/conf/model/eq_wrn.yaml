# Model parameters          
_target_: networks.EquivariantWideResNet            # The name of the model to use
depth: 16
widen_factor: 4
group: cyclic  # "dihedral" "orthogonal"
rotation: 4  # discrete number or frequency
fix_params: True
restrict: None  # "invariant", "reflection", "halved"
layout: [16, 16, 32, 64]
kernel_size: 3
padding: 1
num_groups: [null, null, null, null] #  [1,1,1],
kernel_layout: [3, 3] # [3,3],[3,1],[1,3],[3,1,3],[1,3,1],[3,1,1]
bias: False
act_func: ReLU