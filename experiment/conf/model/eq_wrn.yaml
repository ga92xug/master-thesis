# Model parameters          
_target_: networks.EquivariantWideResNet            # The name of the model to use
depth: 16
widen_factor: 4
group: cyclic  # "dihedral" "orthogonal"
rotation: 8  # discrete number or frequency
fix_params_mode: "iter" # "iter", "heuristic", "all", "no"
restrict: [halved, invariant]  # "invariant", "reflection", "halved"
layout: [16, 16, 32, 64]
kernel_size: 5
padding: 2
kernel_layout: [5, 5] # [3,3],[3,1],[1,3],[3,1,3],[1,3,1],[3,1,1]
bias: False
act_func: ReLU
drop_out: 0.3