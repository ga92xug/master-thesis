# Model parameters          
_target_: networks.eq_resnet.eq_wrn.EquivariantWideResNet           
depth: 16
widen_factor: 4
group: dihedral  # "dihedral" "orthogonal"
rotation: 8  # discrete number or frequency
fix_params_mode: "heuristic" # "iter", "heuristic", "all", "no"
restrict: [halved, halved]  # "invariant", "reflection", "halved"
layout: [16, 16, 32, 64]
kernel_layout: [3, 3] # [3,3],[3,1],[1,3],[3,1,3],[1,3,1],[3,1,1]
bias: False
act_func: ReLU
drop_out: 0.0
average_adaptive_pooling: 1