defaults:
- _self_
- optimizer: SGD
- dataset: stl10
- scheduler: multi_step_lr

dataset:
  name: stl10
  batch_size: 128                # Number of examples to process in a batch during training
  eval_batch_size: 128           # Number of examples to process in a batch during evaluation (default: batch_size)

epochs: 1000                    # Number of training epochs
augment_train: False
earlystop: False               # Whether to use early stopping based on a validation set     


scheduler:
  milestones: [300,400,600,800]
  gamma: 0.5