defaults:
- _self_
- optimizer: Adam
- dataset: galaxy10
- scheduler: multi_step_lr 

epochs: 50

dataset:
  batch_size: 256                # Number of examples to process in a batch during training
  eval_batch_size: 256           # Number of examples to process in a batch during evaluation (default: batch_size)
  augment: False     

optimizer:
  lr: 0.01
  weight_decay: 1e-6
  betas: [0.9,0.999]

scheduler:
  gamma: 0.02
  milestones: [0, 25]