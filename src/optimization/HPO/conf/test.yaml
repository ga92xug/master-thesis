defaults:
  - _self_
  - dataset: DeepDRiD_test

HPOs: 
  test_efficientnet:
    done: False
    eval_only: True
    restore: False
    model_overrides:
      model: efficientnet
      model.pre_trained False

data:
  global_overrides:
    wandb.project: SL-ray
    training: ${dataset.name}-training 
    training.dataset.resolution: 128
    other.should_test: True
    other.verbose: 1

    training.dataset.reduction_factor: 0.5
    training.earlystop.baseline: null

    debug: False
    wandb.mode: online
    #training.earlystop.patience: 0
    training.epochs: 2

    
    